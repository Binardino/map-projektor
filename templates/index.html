<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Projektor</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">

    <button id="sidebar-toggle" aria-label="Toggle menu">☰</button>
    <div id="sidebar-backdrop" hidden></div>

    <aside id="sidebar">
      <div id="sidebar-header">
        <h1>Map<br/>Projektor</h1>
        <p class="tagline">Universal Converter</p>
      </div>
      <div id="country-search">
        <div id="country-search-box">
          <input type="text" id="country-search-input" placeholder="Search a country…" autocomplete="off" />
          <button id="country-search-clear" title="Reset view" hidden>✕</button>
        </div>
        <ul id="country-search-results" hidden></ul>
      </div>
      <button id="compare-toggle">Compare Projections</button>
      <button id="tissot-toggle">Show Distortion Grid</button>
      <button id="flightpath-toggle">Draw Flight Path</button>
      <p id="flightpath-distance" hidden></p>
      <div id="recenter-panel">
        <p class="panel-label">Recenter View</p>
        <nav id="recenter-list">
          <!-- Populated by map.js from the RECENTER_PRESETS array -->
        </nav>
      </div>
      <nav id="projection-list">
        <!-- Populated by map.js from the PROJECTIONS array -->
      </nav>
      <div id="theme-switcher">
        <button class="theme-btn active" data-theme="">Blue</button>
        <button class="theme-btn" data-theme="forest">Forest</button>
        <button class="theme-btn" data-theme="dark">Dark Mode</button>
      </div>
    </aside>

    <main id="main">
      <div id="map-container">
        <svg id="map-svg"></svg>
      </div>
      <div id="projection-info">
        <span id="info-name"></span>
        <span id="info-family"></span>
        <p id="info-description"></p>
      </div>

      <div id="compare-container" hidden>
        <div class="compare-panel" data-side="left">
          <select class="compare-select"></select>
          <svg class="compare-svg"></svg>
        </div>
        <div class="compare-panel" data-side="right">
          <select class="compare-select"></select>
          <svg class="compare-svg"></svg>
        </div>
      </div>
    </main>

  </div>

  <!-- CDN libraries — order matters: d3-geo-projection extends d3, map.js uses both -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4/dist/d3-geo-projection.min.js"></script>
  <script src="/static/js/map.js"></script>
</body>
</html>
