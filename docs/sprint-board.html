  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:14px;}

  .card{background:var(--paper); border:1px solid var(--line); border-left:4px solid; border-radius:10px; padding:10px 11px; box-shadow:var(--shadow); cursor:pointer;}
  .card.dragging{opacity:.4;}
  .card .top-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px;}
  .card .code{font-family:var(--mono); font-size:.7rem; color:var(--muted);}
  .card .handle{cursor:grab; color:var(--muted); font-size:.9rem; padding:0 4px; user-select:none;}
  .card h4{margin:0 0 4px; font-size:.9rem; font-weight:600; line-height:1.3;}
  .card .story-snip{font-size:.78rem; color:var(--muted); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tag{display:inline-block; font-size:.68rem; padding:2px 9px; border-radius:999px; font-weight:600;}
  .card .tag{margin-top:7px;}

  .overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
  [hidden]{display:none!important;}
  .modal{background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; max-width:580px; width:100%; max-height:88vh; overflow-y:auto; padding:22px 24px;}

  .modal .code{font-family:var(--mono); font-size:.75rem; color:var(--muted);}
  .modal h2{font-family:var(--display); font-weight:700; margin:2px 0 10px; font-size:1.3rem; text-wrap:balance;}
  .modal-close{background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer; padding:4px;}
  .modal-tags{margin-bottom:14px;}
  .modal-block{margin-bottom:16px;}
  .modal-block p{margin:0; line-height:1.5;}
  .modal-block .label{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .modal-block.acceptance p{font-size:.84rem; background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--s-done); border-radius:8px; padding:9px 12px;}
  .modal-block.steps ol{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:5px;}
  .modal-block.steps li{font-size:.85rem; line-height:1.45;}
  .modal code{font-family:var(--mono); font-size:.8em; background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:0 4px; overflow-wrap:anywhere;}
  .status-row{display:flex; flex-wrap:wrap; gap:7px;}
  .status-btn{border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:6px 12px; border-radius:999px; font-size:.78rem; cursor:pointer; font-weight:600;}
  .status-btn[aria-pressed="true"]{color:var(--paper-raised);}
  .notice{margin:12px 24px 0; font-size:.78rem; color:var(--muted);}
  @media (max-width:600px){ header{position:static;} header,.progress-strip,.board-scroll{padding-left:16px; padding-right:16px;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>

ntry to survive a projection switch, so that I can compare its shape.", "acceptance": "zoomFactor survives every switch including the polar route; wheel zoom clamped to 1x–6x. (Replaced later by the free camera, #13.)", "steps": ["<code>zoomFactor<\/code> multiplier on the country's auto-fit scale", "Dezoom → morph → rezoom in <code>transitionTo()<\/code>", "Wheel handler clamped [1, 6]", "Playwright check across the polar route"], "order": 5, "code": "S1-5", "id": "s1-5"}, {"epicId": "epic1", "status": "done", "title": "Recentered projection presets (#7)", "story": "As a visitor, I want to recentre the map the way other atlases do, so that I see that Europe in the middle is a convention.", "acceptance": "China, USA/Pacific and South America upside-down presets re-render the current projection; disabled on Albers and polar views; the upside-down view is a true vertical mirror.", "steps": ["<code>RECENTER_PRESETS<\/code> array", "<code>applyRecenter()<\/code> via <code>makeProjection(def, rotation)<\/code>", "Disable on incompatible projections", "Upside-down as an SVG reflection, not a 180° rotate()"], "order": 6, "code": "S1-6", "id": "s1-6"}, {"epicId": "epic1", "status": "done", "title": "Recenter rotation animation and flight path (Feature 9)", "story": "As a visitor, I want the sphere to spin to a new view and to draw a great-circle route, so that changes are easy to follow.", "acceptance": "animateRecenterRotation() spins over 900ms with easeCubicInOut; clicking two points draws the great circle with its distance, mirrored on compare panels.", "steps": ["<code>animateRecenterRotation()<\/code> reusing the per-frame rotate + repath loop", "Flight-path sidebar UI (plan 2026-08-05-flight-path)", "Great circle with <code>d3.geoInterpolate<\/code> on the single view", "Mirror the route onto comparison panels", "Changelog"], "order": 7, "code": "S1-7", "id": "s1-7"}, {"epicId": "epic1", "status": "done", "title": "Sidebar reorganisation (#8)", "story": "As a visitor 2026-09-21-modularization/ holds the README and pr1–pr5, merged.", "steps": ["Audit of <code>map.js<\/code> (8 items)", "One plan file per PR", "Order: safety net → split → config → state → MapView"], "order": 1, "code": "S4-1", "id": "s4-1"}, {"epicId": "epic4", "status": "done", "title": "PR 1 — refactor safety net (#40, #42)", "story": "As a developer, I want checks that catch any visible change, so that refactors can't silently break the app.", "acceptance": "ui_text_snapshot.py, render_fingerprint.py, e2e_smoke.py, node:test and window.__app exist; perf baseline is the median of 3 runs; scripts/check_all.sh runs them all.", "steps": ["<code>static/js/debug.js<\/code> read-only <code>window.__app<\/code>", "<code>scripts/ui_text_snapshot.py<\/code> + golden", "<code>scripts/render_fingerprint.py<\/code> + golden", "<code>scripts/e2e_smoke.py<\/code>", "<code>tests/js/*.test.mjs<\/code> with Node's runner", "<code>--write-baseline<\/code> median of 3 (#42)"], "order": 2, "code": "S4-2", "id": "s4-2"}, {"epicId": "epic4", "status": "done", "title": "PR 2 — split map.js into ES modules (#41)", "story": "As a developer, I want the code in small layered modules, so that each part is easy to find and change.", "acceptance": "map.js deleted; data < core < ui/tools < main.js enforced by tests/js/layering.test.mjs; unreachable tools isolated, not loaded; fingerprint unchanged.", "steps": ["<code>static/js/main.js<\/code> entry", "<code>data/<\/code>, <code>core/<\/code>, <code>ui/<\/code>, <code>tools/<\/code>", "<code>tools/index.js<\/code> as core's only way in", "modulepreload list + test", "Layering test"], "order": 3, "code": "S4-3", "id": "s4-3"}, {"epicId": "epic4", "status": "done", "title": "PR 3 — projection capabilities, config, colour tokens (#43)", "story": "As a developer, I want projection behaviour declared on each projection, so that nothing tests ids in the code.", "acceptance": "globe, clipAngle, fit, polarRotation, recenterable, tilted with PROJECTION t DNS", "Decide public vs Basic Auth (<code>APP_USER<\/code>/<code>APP_PASSWORD<\/code>)", "Optional CSP / X-Frame-Options middleware", "Dependabot or <code>pip-audit<\/code>"], "order": 6, "code": "S5-6", "id": "s5-6"}, {"epicId": "epic6", "status": "done", "title": "Language plumbing (in #44)", "story": "As a developer, I want setLanguage() to reload texts and re-render the UI, so that a picker only has to call it.", "acceptance": "setLanguage(lang) loads static/i18n/<lang>.json, emits language:changed, and every UI builder re-renders; the app boots through it.", "steps": ["<code>setLanguage<\/code> in <code>static/js/i18n.js<\/code>", "Idempotent builders subscribed to <code>language:changed<\/code>", "e2e <code>ui_rebuild<\/code>"], "order": 1, "code": "S6-1", "id": "s6-1"}, {"epicId": "epic6", "status": "backlog", "title": "Freeze the English copy", "story": "As the owner, I want every English text validated first, so that translations are done once.", "acceptance": "en.json reviewed and signed off; UI text snapshot rewritten from it.", "steps": ["Review <code>static/i18n/en.json<\/code> key by key", "Fix wording", "<code>scripts/ui_text_snapshot.py --write<\/code>"], "order": 2, "code": "S6-2", "id": "s6-2"}, {"epicId": "epic6", "status": "backlog", "title": "Language picker in the toolbar", "story": "As a visitor, I want to choose my language from the toolbar, so that I can read the app in it.", "acceptance": "A toolbar button lists the languages, calls setLanguage(), and the choice is saved in localStorage.", "steps": ["Button in <code>#map-tools<\/code> with tooltip", "Language list from available <code>static/i18n/*.json<\/code>", "<code>setLanguage()<\/code> on pick", "Remember in <code>localStorage<\/code>", "e2e scenario"], "order": 3, "code": "S6-3", "id": "s6-3"}, {"epicId": "epic6", "status": "backlog", "title": "UI translations", "story": "As a visitor, I want the interface in FR, ES, PT, zh-Hans, zh-Hant (TW and HK), JA, IT, PL, AR, HI, RU and SW, , I want to know which projections invert reliably, so that dragging works or is disabled with a reason.", "acceptance": "For all 17 projections (Europe and China views), project(invert(p)) ≈ p within 0.5 px on a 40×20 grid, never null/NaN inside the outline; table of pass/fail.", "steps": ["Playwright script over <code>window.__app.makeProjection<\/code>", "Grid inside the sphere outline", "Pass/fail table", "Fallback decision for failures"], "order": 2, "code": "S7-2", "id": "s7-2"}, {"epicId": "epic7", "status": "backlog", "title": "Sphere-move maths", "story": "As a developer, I want pure functions that move a country on the sphere, so that it keeps its true size.", "acceptance": "tests/js/sphere-move.test.mjs: centroid lands within 1e-9°, pairwise great-circle distances unchanged, antimeridian and pole moves stay finite and closed.", "steps": ["<code>static/js/core/sphere-move.js<\/code>: <code>lonLatToVec<\/code>, <code>vecToLonLat<\/code>, <code>rotationBetween<\/code>", "<code>moveRing<\/code>, <code>moveFeature<\/code> (Polygon/MultiPolygon)", "<code>upright<\/code> option", "Isometry tests"], "order": 3, "code": "S7-3", "id": "s7-3"}, {"epicId": "epic7", "status": "backlog", "title": "Orientation spike and per-move cost", "story": "As a developer, I want the upright choice and cost measured, so that the drag looks right and stays fast.", "acceptance": "D3 decided with screenshots in the README; moveFeature + geoPath under 4 ms at p95 for Russia, Canada, Antarctica.", "steps": ["Scratch page: drag Africa, Russia, Chile, Greenland", "Mercator, Robinson, Orthographic, upright on/off", "Time 200 moves, full vs light geometry", "Record numbers in the README"], "order": 4, "code": "S7-4", "id": "s7-4"}, {"epicId": "epic7", "status": "backlog", "title": "Pointer to geographic pipeline", "story": "As a developer, I want a screen point converted to lon/lat through zoom and flip, so that the country follows the cursor.", "acceptance": "e2e: drag by a known offset in default, zoomed 3x, panned, China and upside-down views; overlay centroid within 3 px of the cursor.", "steps": ["<code>core/pointer-geo.js<\/code>", "Undo the camera transform", "Undo the upside-down flip", "<code>projection.invert<\/code> on the recentred projection"], "order": 5, "code": "S7-5", "id": "s7-5"}, {"epicId": "epic7", "status": "backlog", "title": "Overlay, ghost and drag gesture", "story": "As a visitor, I want to grab the selected country and drag it, so that I watch it deform.", "acceptance": "Dragging from the country moves it; dragging the ocean still pans; wheel zoom works over the country; on the globe, elsewhere still rotates.", "steps": ["<code>country-drag<\/code> tool", "Ghost outline at home", "Overlay in the highlight layer with <code>d3.drag<\/code>", "Clamp at the horizon on the globe"], "order": 6, "code": "S7-6", "id": "s7-6"}, {"epicId": "epic7", "status": "backlog", "title": "Hit area for small countries", "story": "As a visitor, I want to grab tiny countries, so that Luxembourg works like Russia.", "acceptance": "Luxembourg and Singapore can be grabbed at default zoom (e2e).", "steps": ["Invisible ~14 px non-scaling stroke", "Hover halo", "grab / grabbing cursors"], "order": 7, "code": "S7-7", "id": "s7-7"}, {"epicId": "epic7", "status": "backlog", "title": "Compare card rework", "story": "As a visitor, I want a Move country switch and Back to place, so that I control the drag.", "acceptance": "e2e: select → drag → back to place → close card removes overlay and ghost; new strings in en.json.", "steps": ["Remove the second-projection dropdown (D1)", "<code>compare.moveCountry<\/code>, <code>compare.backToPlace<\/code> keys", "Switch suspends pan while ON", "No auto-zoom in this mode"], "order": 8, "code": "S7-8", "id": "s7-8"}, {"epicId": "epic7", "status": "backlog", "title": "Persistence and edge cases", "story": "As a visitor, I want my moved country to stay put across projections and views, so that I can compare.", "acceptance": "Displace a country, switch Mercator → Robinson → globe → China view: position kept; Esc resets.", "steps": ["Keep target lon/lat", "Fade during morphs (view:changing / view:changed)", "Clamp ±85° on Mercator", "Esc resets"], "order": 9, "code": "S7-9", "id": "s7-9"}, {"epicId": "epic7", "status": "backlog", "title": "Touch support", "story": "As a phone user, I want to move a country with one finger, so that the feature works on mobile.", "acceptance": "Playwright touch emulation: one finger on the country moves it, elsewhere pans; small countries grabbable at 390 px via the switch.", "steps": ["Pointer events for touch", "Two-finger pan/zoom", "390 px e2e"], "order": 10, "code": "S7-10", "id": "s7-10"}, {"epicId": "epic7", "status": "backlog", "title": "Area readout (stretch)", "story": "As a visitor, I want to read how much bigger the country looks, so that the distortion is a number.", "acceptance": "Africa dragged from the equator to 60°N on Mercator reports a ratio within 5% of 1/cos²φ.", "steps": ["Ratio of projected <code>geoPath.area<\/code>", "Show it in the card", "Locale formatting"], "order": 11, "code": "S7-11", "id": "s7-11"}, {"epicId": "epic7", "status": "backlog", "title": "Regression, perf and docs", "story": "As a developer, I want the full gate green, so that the feature ships without regressions.", "acceptance": "scripts/check_all.sh green; perf within 1.15x; CLAUDE.md and changelog updated; decision on the isolated True Size tool.", "steps": ["Displaced country during a morph", "<code>scripts/check_all.sh<\/code>", "CLAUDE.md + CHANGELOG"], "order": 12, "code": "S7-12", "id": "s7-12"}, {"epicId": "epic8", "status": "backlog", "title": "Progressive onboarding", "story": "As a first-time visitor, I want the controls introduced one at a time as I use them, so that I learn without a wall of text.", "acceptance": "Replaces the removed How it works section; hints appear next to the controls they describe.", "steps": ["Pick the controls to introduce", "Hint component with i18n keys", "Show once per control"], "order": 1, "code": "S8-1", "id": "s8-1"}, {"epicId": "epic8", "status": "backlog", "title": "Guessing game mode (Feature 14)", "story": "As a visitor, I want a game around projections or distorted shapes, so that learning is playful.", "acceptance": "Game mechanics defined in a brainstorm before any scoping.", "steps": ["Brainstorm session", "Write a spec", "Scope into tickets"], "order": 2, "code": "S8-2", "id": "s8-2"}, {"epicId": "epic8", "status": "backlog", "title": "Decide the fate of the isolated tools", "story": "As the owner, I want to decide on side-by-side, flight path and True Size, so that unused code is either revived or removed.", "acceptance": "A decision per tool: revive on MapView, rebuild on country drag, or delete.", "steps": ["Review <code>static/js/tools/<\/code> (side-by-side, flight path, true size)", "Decide per tool", "Follow-up tickets"], "order": 3, "code": "S8-3", "id": "s8-3"}, {"epicId": "epic8", "status": "backlog", "title": "Visual refresh (Feature 10)", "story": "As a visitor, I want a modern, Apple-like look, so that the app feels current.", "acceptance": "Paused on 2026-09-14 pending designer feedback; to reassess against the Figma redesign (#25).", "steps": ["Compare with what #25 already delivered", "Resume the brainstorm if gaps remain"], "order": 4, "code": "S8-4", "id": "s8-4"}];</script>
<script>
(function(){
  "use strict";
  var EPICS = {
    epic0:{name:"Foundation", sprint:0, when:"June 2026", color:"var(--e0)"},
    epic1:{name:"First features", sprint:1, when:"Aug 3–6 · #1–#8", color:"var(--e1)"},
    epic2:{name:"Designer feedback pass", sprint:2, when:"Sep 6–12 · #9–#24", color:"var(--e2)"},
    epic3:{name:"Figma redesign & polish", sprint:3, when:"Sep 20–26 · #25–#39", color:"var(--e3)"},
    epic4:{name:"Modularization", sprint:4, when:"Sep 24 → · #29, #40–#44", color:"var(--e4)"},
    epic5:{name:"Deploy", sprint:5, when:"Sep 28 → · #45, #46", color:"var(--e5)"},
    epic6:{name:"Languages (Feature 31)", sprint:6, when:"after PR 4", color:"var(--e6)"},
    epic7:{name:"Country drag (Feature 32)", sprint:7, when:"after PR 5", color:"var(--e7)"},
    epic8:{name:"V2 ideas", sprint:8, when:"later", color:"var(--e8)"}
  };
  var STATUSES = [
    {key:"backlog", label:"Backlog", color:"var(--s-backlog)"},
    {key:"todo", label:"To Do", color:"var(--s-todo)"},
    {key:"in_progress", label:"In Progress", color:"var(--s-progress)"},
    {key:"review", label:"Review", color:"var(--s-review)"},
    {key:"done", label:"Done", color:"var(--s-done)"}
  ];
  var state = { tickets: [], filter: "all", db: null };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // Steps may carry <code> spans; everything else is escaped since shared rows are untrusted.
  function richStep(s){ return esc(s).replace(/&lt;code&gt;/g,"<code>").replace(/&lt;\/code&gt;/g,"</code>"); }
  function soft(color){ return "color-mix(in srgb, "+color+" 16%, transparent)"; }
  function epicOf(t){ return EPICS[t.epicId]; }

  function visible(){ return state.tickets.filter(function(t){
    return state.filter === "all" || epicOf(t).sprint === state.filter; }); }
  function ticketsByStatus(status){
    return visible().filter(function(t){ return t.status === status; })
      .sort(function(a,b){ return (epicOf(a).sprint - epicOf(b).sprint) || (a.order - b.order); });
  }
  function renderTotals(){
    var all = state.tickets, done = all.filter(function(t){ return t.status === "done"; }).length;
    var open = all.filter(function(t){ return t.status === "todo" || t.status === "in_progress" || t.status === "review"; }).length;
    document.getElementById("totals").innerHTML = "<b>"+done+"</b>/"+all.length+" done · <b>"+open+"</b> open";
  }
  function renderTabs(){
    var wrap = document.getElementById("sprintTabs"); wrap.innerHTML = "";
    var tabs = [{key:"all", label:"All sprints", color:"var(--muted)"}].concat(Object.keys(EPICS).map(function(k){
      var e = EPICS[k]; return {key:e.sprint, label:"Sprint "+e.sprint, title:e.name, color:e.color}; }));
    tabs.forEach(function(s){
      var b = document.createElement("button"); b.className = "sprint-tab"; b.id = "tab-"+s.key;
      b.setAttribute("data-active", String(state.filter === s.key));
      if (s.title) b.title = s.title;
      b.innerHTML = '<span class="dot" style="background:'+s.color+'"></span>'+esc(s.label);
      b.onclick = function(){ state.filter = s.key; renderAll(); };
      wrap.appendChild(b);
    });
  }
  function renderProgress(){
    var wrap = document.getElementById("progressStrip"); wrap.innerHTML = "";
    Object.keys(EPICS).forEach(function(epicId){
      var e = EPICS[epicId];
      var all = state.tickets.filter(function(t){ return t.epicId === epicId; });
      var done = all.filter(function(t){ return t.status === "done"; }).length;
      var pct = all.length ? Math.round(done / all.length * 100) : 0;
      var b = document.createElement("button"); b.className = "progress-item";
      b.innerHTML = '<div class="row"><strong>S'+e.sprint+' · '+esc(e.name)+'</strong><span>'+done+'/'+all.length+'</span></div>'+
        '<span class="when">'+esc(e.when)+'</span><div class="bar"><i style="width:'+pct+'%;background:'+e.color+'"></i></div>';
      b.onclick = function(){ state.filter = e.sprint; renderAll(); };
      wrap.appendChild(b);
    });
  }
  function cardEl(t){
    var e = epicOf(t);
    var el = document.createElement("div"); el.className = "card"; el.style.borderLeftColor = e.color;
    el.tabIndex = 0;
    el.innerHTML = '<div class="top-row"><span class="code">'+esc(t.code)+'</span><span class="handle" draggable="true" title="Drag to another column">⠿</span></div>'+
      '<h4>'+esc(t.title)+'</h4><p class="story-snip">'+esc(t.story)+'</p>'+
      '<span class="tag" style="background:'+soft(e.color)+';color:'+e.color+'">S'+e.sprint+' · '+esc(e.name)+'</span>';
    el.addEventListener("click", function(ev){ if (!ev.target.classList.contains("handle")) openModal(t.id); });
    el.addEventListener("keydown", function(ev){ if (ev.key === "Enter") openModal(t.id); });
    var handle = el.querySelector(".handle");
    handle.addEventListener("dragstart", function(ev){
      ev.stopPropagation(); ev.dataTransfer.setData("text/plain", t.id); ev.dataTransfer.effectAllowed = "move";
      setTimeout(function(){ el.classList.add("dragging"); }, 0);
    });
    handle.addEventListener("dragend", function(){ el.classList.remove("dragging"); });
    return el;
  }
  function renderBoard(){
    var board = document.getElementById("board"); board.innerHTML = "";
    STATUSES.forEach(function(s){
      var col = document.createElement("div"); col.className = "column";
      var items = ticketsByStatus(s.key);
      var head = document.createElement("div"); head.className = "column-head";
      head.innerHTML = '<h3><span class="stripe" style="background:'+s.color+'"></span>'+s.label+'</h3><span class="count">'+items.length+'</span>';
      col.appendChild(head);
      var cardsWrap = document.createElement("div"); cardsWrap.className = "cards";
      if (!items.length){
        var hint = document.createElement("div"); hint.className = "empty-hint"; hint.textContent = "Drop a card here";
        cardsWrap.appendChild(hint);
      } else items.forEach(function(t){ cardsWrap.appendChild(cardEl(t)); });
      col.appendChild(cardsWrap);
      col.addEventListener("dragover", function(ev){ ev.preventDefault(); col.classList.add("dragover"); });
      col.addEventListener("dragleave", function(){ col.classList.remove("dragover"); });
      col.addEventListener("drop", function(ev){
        ev.preventDefault(); col.classList.remove("dragover");
        setStatus(ev.dataTransfer.getData("text/plain"), s.key);
      });
      board.appendChild(col);
    });
  }
  function notice(msg){ var n = document.getElementById("notice"); n.textContent = msg; n.hidden = !msg; }
  function setStatus(id, newStatus){
    var t = state.tickets.filter(function(x){ return x.id === id; })[0];
    if (!t || t.status === newStatus) return;
    var previous = t.status;
    t.status = newStatus; renderAll();
    if (!state.db) return;
    state.db.collection("tickets").doc(id).update({ status: newStatus }).catch(function(){
      t.status = previous; renderAll();
      notice("Only people with edit access can move tickets. Your change was not saved.");
    });
  }
  function openModal(id){
    var t = state.tickets.filter(function(x){ return x.id === id; })[0]; if (!t) return;
    var e = epicOf(t);
    var overlay = document.getElementById("overlay"), modal = document.getElementById("modal");
    var buttons = STATUSES.map(function(s){
      var on = s.key === t.status;
      return '<button class="status-btn" data-status="'+s.key+'" aria-pressed="'+on+'"'+
        (on ? ' style="background:'+s.color+';border-color:'+s.color+'"' : '')+'>'+s.label+'</button>';
    }).join("");
    var steps = (t.steps || []).map(function(s){ return "<li>"+richStep(s)+"</li>"; }).join("");
    modal.innerHTML = '<div class="modal-head"><div><div class="code">'+esc(t.code)+'</div><h2>'+esc(t.title)+'</h2></div>'+
      '<button class="modal-close" aria-label="Close">✕</button></div>'+
      '<div class="modal-tags"><span class="tag" style="background:'+soft(e.color)+';color:'+e.color+'">Sprint '+e.sprint+' · '+esc(e.name)+'</span></div>'+
      '<div class="modal-block"><div class="label">User story</div><p>'+esc(t.story)+'</p></div>'+
      '<div class="modal-block acceptance"><div class="label">Acceptance criteria</div><p>'+esc(t.acceptance)+'</p></div>'+
      (steps ? '<div class="modal-block steps"><div class="label">Implementation steps</div><ol>'+steps+'</ol></div>' : '')+
      '<div class="modal-block"><div class="label">Status</div><div class="status-row">'+buttons+'</div></div>';
    modal.querySelector(".modal-close").onclick = closeModal;
    modal.querySelectorAll(".status-btn").forEach(function(btn){
      btn.onclick = function(){ setStatus(t.id, btn.dataset.status); closeModal(); };
    });
    overlay.hidden = false; modal.querySelector(".modal-close").focus();
  }
  function closeModal(){ document.getElementById("overlay").hidden = true; }
  document.getElementById("overlay").addEventListener("click", function(ev){ if (ev.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeModal(); });

  function renderAll(){ renderTotals(); renderTabs(); renderProgress(); renderBoard(); }
  function normalise(id, d){
    if (!d || !EPICS[d.epicId]) return null;
    return { id:id, epicId:d.epicId, code:d.code, order:d.order || 0, status:d.status || "backlog",
      title:d.title, story:d.story, acceptance:d.acceptance, steps:d.steps || [] };
  }
  function useTickets(list){ if (list && list.length){ state.tickets = list; renderAll(); } }

  // Fallback first (inline copy in the repo, published tickets.json on claude.ai), then the live db wins.
  renderAll();
  if (window.__TICKETS) useTickets(window.__TICKETS.map(function(d){ return normalise(d.id, d); }).filter(Boolean));
  else fetch("tickets.json").then(function(r){ return r.ok ? r.json() : []; }).then(function(list){
    if (!state.fromDb) useTickets(list.map(function(d){ return normalise(d.id, d); }).filter(Boolean));
  }).catch(function(){});

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if (!db) return;
      state.db = db;
      db.collection("tickets").onSnapshot(function(snap){
        if (snap.empty) return;
        var next = [];
        snap.docs.forEach(function(d){ var t = normalise(d.id, d.data()); if (t) next.push(t); });
        if (next.length){ state.fromDb = true; useTickets(next); }
      }, function(){});
    }).catch(function(){});
  }
})();
</script>
</body></html>
