<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Projektor</title>
  <!-- Written here, not through data-i18n: search engines and link previews
       read the raw HTML without running the JavaScript -->
  <meta name="description" content="An interactive world map that morphs between 17 projections, so you can see what each one preserves and what it distorts." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Map Projektor" />
  <meta property="og:title" content="Map Projektor" />
  <meta property="og:description" content="An interactive world map that morphs between 17 projections, so you can see what each one preserves and what it distorts." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <!-- Closest free match for the Figma design's "Neulis Neue" (a rounded
       geometric sans not available for web use) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Every module main.js imports, fetched in parallel instead of level by
       level as imports are discovered (tests/js/modulepreload.test.mjs keeps
       this list in step with the code) -->
  <link rel="modulepreload" href="/static/js/config.js" />
  <link rel="modulepreload" href="/static/js/core/animation.js" />
  <link rel="modulepreload" href="/static/js/core/busy.js" />
  <link rel="modulepreload" href="/static/js/core/camera.js" />
  <link rel="modulepreload" href="/static/js/core/geometry.js" />
  <link rel="modulepreload" href="/static/js/core/map-view.js" />
  <link rel="modulepreload" href="/static/js/core/palette.js" />
  <link rel="modulepreload" href="/static/js/core/projection.js" />
  <link rel="modulepreload" href="/static/js/core/recenter.js" />
  <link rel="modulepreload" href="/static/js/core/render.js" />
  <link rel="modulepreload" href="/static/js/core/scene.js" />
  <link rel="modulepreload" href="/static/js/core/selection.js" />
  <link rel="modulepreload" href="/static/js/core/sphere-move.js" />
  <link rel="modulepreload" href="/static/js/core/transition.js" />
  <link rel="modulepreload" href="/static/js/data/geodata.js" />
  <link rel="modulepreload" href="/static/js/data/projections.js" />
  <link rel="modulepreload" href="/static/js/data/views.js" />
  <link rel="modulepreload" href="/static/js/debug.js" />
  <link rel="modulepreload" href="/static/js/i18n.js" />
  <link rel="modulepreload" href="/static/js/main.js" />
  <link rel="modulepreload" href="/static/js/state.js" />
  <link rel="modulepreload" href="/static/js/tools/index.js" />
  <link rel="modulepreload" href="/static/js/tools/reference-lines.js" />
  <link rel="modulepreload" href="/static/js/tools/tissot.js" />
  <link rel="modulepreload" href="/static/js/ui/compare-card.js" />
  <link rel="modulepreload" href="/static/js/ui/info-card.js" />
  <link rel="modulepreload" href="/static/js/ui/mobile-sidebar.js" />
  <link rel="modulepreload" href="/static/js/ui/onboarding.js" />
  <link rel="modulepreload" href="/static/js/ui/sidebar.js" />
  <link rel="modulepreload" href="/static/js/ui/theme.js" />
  <link rel="modulepreload" href="/static/js/ui/language-picker.js" />
  <link rel="modulepreload" href="/static/js/ui/welcome-modal.js" />
</head>
<body>
  <div id="app">

    <button id="sidebar-toggle" data-i18n-attr="aria-label:sidebar.menuToggle">☰</button>
    <div id="sidebar-backdrop" hidden></div>

    <aside id="sidebar">
      <div id="sidebar-header">
        <h1 data-i18n="app.title"></h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
      <nav id="projection-list">
        <p class="section-title" data-i18n="sidebar.selectProjection"></p>
        <!-- Family headers + buttons built by ui/sidebar.js from the PROJECTIONS array -->
      </nav>
      <div id="recenter-panel">
        <p class="section-title" data-i18n="sidebar.selectView"></p>
        <nav id="recenter-list">
          <!-- Built by ui/sidebar.js from the RECENTER_PRESETS array -->
        </nav>
      </div>
    </aside>

    <main id="main">
      <div id="map-container">
        <svg id="map-svg"></svg>
        <div id="zoom-controls">
          <button id="zoom-in-btn" data-i18n-attr="aria-label:zoom.in;title:zoom.in">
            <svg width="16" height="16" viewBox="0 0 16.5 16.5" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.25 0.75V15.75M15.75 8.25H0.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="zoom-out-btn" data-i18n-attr="aria-label:zoom.out;title:zoom.out">
            <svg width="15" height="2" viewBox="0 0 15.5 1.5" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.75 0.75H14.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="map-tools">
          <button id="grid-toggle-btn" class="tool-btn" aria-pressed="false" data-i18n-attr="aria-label:tool.grid;data-tooltip:tool.grid">
            <svg width="16" height="17" viewBox="0 0 16 16.2002" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.75 0C11.1642 1.81059e-08 11.5 0.335786 11.5 0.75V4.5H15.25C15.6642 4.5 16 4.83579 16 5.25C16 5.66421 15.6642 6 15.25 6H11.5V11H15.25C15.6642 11 16 11.3358 16 11.75C16 12.1642 15.6642 12.5 15.25 12.5H11.5V15.25C11.5 15.6642 11.1642 16 10.75 16C10.3358 16 10 15.6642 10 15.25V12.5H5.5V15.4502C5.4999 15.8643 5.16415 16.2002 4.75 16.2002C4.33585 16.2002 4.0001 15.8643 4 15.4502V12.5H0.75C0.335787 12.5 7.19743e-07 12.1642 0 11.75C3.62117e-08 11.3358 0.335787 11 0.75 11H4V6H0.75C0.335787 6 7.19743e-07 5.66421 0 5.25C3.62117e-08 4.83579 0.335787 4.5 0.75 4.5H4V0.950195C4 0.535982 4.33579 0.200195 4.75 0.200195C5.16421 0.200195 5.5 0.535982 5.5 0.950195V4.5H10V0.75C10 0.335786 10.3358 -1.81059e-08 10.75 0ZM5.5 11H10V6H5.5V11Z" fill="currentColor"/></svg>
          </button>
          <button id="reference-toggle-btn" class="tool-btn" aria-pressed="false" data-i18n-attr="aria-label:tool.referenceLines;data-tooltip:tool.referenceLines">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M0.75 8H15.25M2.5 4H13.5M2.5 12H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="8" cy="8" rx="3" ry="7.25" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <button id="theme-toggle-btn" class="tool-btn" data-i18n-attr="aria-label:tool.theme;data-tooltip:tool.theme">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.10059 0.00195312C12.4725 0.0558304 16 3.6153 16 8C16 12.3847 12.4725 15.9432 8.10059 15.9971V16C8.08377 16 8.0666 15.9982 8.0498 15.998C8.03321 15.9981 8.01662 16 8 16C3.58172 16 0 12.4183 0 8C0 3.58172 3.58172 0 8 0C8.01662 0 8.03321 0.000875405 8.0498 0.000976562C8.0666 0.000872911 8.08377 0 8.10059 0V0.00195312ZM8.10059 14.4971C11.644 14.4433 14.5 11.5563 14.5 8C14.5 4.44374 11.644 1.55572 8.10059 1.50195V14.4971Z" fill="currentColor"/></svg>
          </button>
          <button id="compare-toggle-btn" class="tool-btn" aria-pressed="false" data-i18n-attr="aria-label:tool.compare;data-tooltip:tool.compare">
            <svg width="16" height="23" viewBox="0 0 16 23" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8.0498 0C8.46402 1.81059e-08 8.7998 0.335786 8.7998 0.75V3H15C15.5523 3 16 3.44772 16 4V18C16 18.5523 15.5523 19 15 19H8.7998V22.25C8.7998 22.6642 8.46402 23 8.0498 23C7.63576 22.9998 7.2998 22.6641 7.2998 22.25V19H1L0.897461 18.9951C0.393331 18.9438 0 18.5177 0 18V4C0 3.48232 0.393331 3.05621 0.897461 3.00488L1 3H7.2998V0.75C7.2998 0.335909 7.63576 0.000197827 8.0498 0ZM8.7998 17.5H14.5V4.5H8.7998V17.5ZM1.5 17.5H7.2998V4.5H1.5V17.5Z" fill="currentColor"/></svg>
          </button>
          <button id="language-toggle-btn" class="tool-btn" aria-pressed="false" data-i18n-attr="aria-label:tool.language;data-tooltip:tool.language">
            <svg width="28" height="24" viewBox="0 0 28 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.43 4.29H9.14V5.56H2.43ZM0 7.9H12.52V9.2H0ZM5.53 7.05H6.99V11.91Q6.99 12.47 6.81 12.79Q6.64 13.11 6.19 13.27Q5.76 13.43 5.12 13.46Q4.48 13.5 3.57 13.5Q3.52 13.3 3.42 13.05Q3.32 12.79 3.21 12.55Q3.09 12.3 2.97 12.13Q3.44 12.13 3.89 12.14Q4.35 12.16 4.7 12.15Q5.05 12.14 5.18 12.14Q5.39 12.14 5.46 12.08Q5.53 12.01 5.53 11.87ZM8.72 4.29H9.1L9.43 4.22L10.34 4.92Q9.82 5.46 9.15 6Q8.49 6.54 7.76 7.02Q7.03 7.49 6.28 7.84Q6.15 7.67 5.92 7.43Q5.69 7.19 5.53 7.05Q6.14 6.74 6.75 6.32Q7.36 5.89 7.88 5.43Q8.4 4.97 8.72 4.56ZM0.13 1.56H12.4V4.69H10.99V2.86H1.47V4.69H0.13ZM5.04 0.42 6.4 0Q6.7 0.39 6.98 0.88Q7.26 1.37 7.39 1.75L5.96 2.24Q5.86 1.86 5.6 1.35Q5.34 0.84 5.04 0.42ZM25.88 2V10.67H24.3V2H23.17V0.66H27.5V2ZM19.52 0.5Q20.47 0.5 21.06 0.82Q21.66 1.14 21.93 1.68Q22.19 2.22 22.19 2.88Q22.19 4.04 21.31 4.76Q20.44 5.49 18.49 5.65L18.23 4.34Q19.18 4.23 19.71 4.05Q20.23 3.86 20.44 3.58Q20.65 3.3 20.65 2.9Q20.65 2.4 20.33 2.12Q20.02 1.85 19.41 1.85Q18.88 1.85 18.36 2Q17.85 2.16 17.35 2.46L16.88 1.16Q17.45 0.84 18.1 0.67Q18.76 0.5 19.52 0.5ZM22.45 7.18Q22.45 8.38 21.66 9.06Q20.87 9.73 19.6 9.73Q18.6 9.73 17.82 9.31Q17.03 8.88 16.34 7.88Q15.66 6.89 15 5.17L16.32 4.59Q16.99 6.47 17.72 7.42Q18.44 8.37 19.44 8.37Q20.12 8.37 20.52 8.01Q20.92 7.66 20.92 7Q20.92 6.34 20.45 5.84Q19.97 5.34 19.34 4.99L20.15 4.7L20.95 4.6Q21.18 4.78 21.44 5.03Q21.71 5.28 21.87 5.54L22.03 5.82Q22.24 6.13 22.34 6.47Q22.45 6.81 22.45 7.18ZM22.71 5Q23.29 5 23.9 4.88Q24.51 4.76 25.15 4.47L25.18 5.89Q24.65 6.11 24.11 6.21Q23.57 6.31 23.03 6.31Q22.58 6.31 22.09 6.23Q21.61 6.15 21.16 6.03L20.87 5.02L20.98 4.78Q21.39 4.89 21.83 4.95Q22.27 5 22.71 5Z" fill="currentColor"/><path d="M10.5 23.5 13.65 16 16.8 23.5M11.7 20.95h3.9000000000000004" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="info-toggle-btn" class="tool-btn" aria-pressed="false" data-i18n-attr="aria-label:tool.info;data-tooltip:tool.info">i</button>
          <button id="tour-replay-btn" class="tool-btn" data-i18n-attr="aria-label:tool.tour;data-tooltip:tool.tour">?</button>
        </div>
        <div id="floating-cards">
          <div id="language-card" class="floating-card" hidden>
            <div class="floating-card-header">
              <p class="floating-card-title" data-i18n="language.title"></p>
              <button id="language-card-close" class="floating-card-close" data-i18n-attr="aria-label:common.close">✕</button>
            </div>
            <div id="language-list"></div>
          </div>
          <div id="compare-card" class="floating-card" hidden>
            <div class="floating-card-header">
              <p class="floating-card-title" data-i18n="compare.title"></p>
              <button id="compare-card-close" class="floating-card-close" data-i18n-attr="aria-label:common.close">✕</button>
            </div>
            <p class="floating-card-description" data-i18n="compare.description"></p>
            <div id="compare-country-picker">
              <input type="text" id="compare-country-input" data-i18n-attr="placeholder:compare.countryPlaceholder" autocomplete="off" />
              <ul id="compare-country-results" hidden></ul>
            </div>
            <ul id="compare-country-list" hidden></ul>
            <select id="compare-projection-select">
              <option value="" selected data-i18n="compare.mapProjection"></option>
            </select>
          </div>
          <div id="projection-info" class="floating-card" hidden>
            <div class="floating-card-header">
              <p id="info-name" class="floating-card-title"></p>
              <button id="info-close-btn" class="floating-card-close" data-i18n-attr="aria-label:common.close">✕</button>
            </div>
            <dl id="info-tradeoffs-content"></dl>
          </div>
        </div>
      </div>

      <div id="compare-container" hidden>
        <div class="compare-panel" data-side="left">
          <select class="compare-select"></select>
          <svg class="compare-svg"></svg>
        </div>
        <div class="compare-panel" data-side="right">
          <select class="compare-select"></select>
          <svg class="compare-svg"></svg>
        </div>
      </div>
    </main>

    <div id="help-modal-backdrop" hidden>
      <div id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
        <button id="help-modal-close" data-i18n-attr="aria-label:common.close">✕</button>
        <h2 id="help-modal-title" data-i18n="welcome.title"></h2>
        <div id="help-modal-body">
          <p data-i18n="welcome.intro1"></p>
          <p data-i18n="welcome.intro2"></p>
          <p data-i18n="welcome.intro3"></p>
          <p data-i18n="welcome.intro4"></p>
        </div>
        <div id="help-modal-footer">
          <select id="welcome-language-select" data-i18n-attr="aria-label:language.title"></select>
          <button id="help-modal-cta" data-i18n="welcome.cta"></button>
        </div>
      </div>
    </div>

    <!-- Onboarding tour: steps and positions are set by ui/onboarding.js -->
    <div id="tour" hidden>
      <div id="tour-spotlight"></div>
      <div id="tour-bubble" role="dialog" aria-labelledby="tour-title" aria-describedby="tour-text">
        <p id="tour-progress"></p>
        <h2 id="tour-title"></h2>
        <p id="tour-text"></p>
        <div id="tour-actions">
          <button id="tour-skip" data-i18n="tour.skip"></button>
          <button id="tour-next"></button>
        </div>
      </div>
    </div>

  </div>

  <!-- CDN libraries — order matters: d3-geo-projection extends d3, the modules use both.
       Exact versions: a floating one would let a new release change the live site with no deploy. -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4.0.0/dist/d3-geo-projection.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
